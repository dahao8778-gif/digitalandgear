<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="wallPet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf2e9"/>
