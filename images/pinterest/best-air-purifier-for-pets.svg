    <text x="800" y="1385" text-anchor="middle" font-size="14" fill="#fdba74">🔄 Pet Auto Mode</text>
    <text x="800" y="1406" text-anchor="middle" font-size="14">Air-Quality Sensor Auto-Speed</text>
